services:
  api:
    image: triage-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - MODEL_PATH=/app/models/model.joblib
      - MODEL_BACKEND=joblib
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  train:
    image: triage-api
    profiles:
      - train
    env_file:
      - ../.env
    environment:
      - MODEL_PATH=/app/models/model.joblib
      - MODEL_BACKEND=joblib
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../reports:/app/reports
      - ../configs:/app/configs
    command: ["python", "-m", "src.train.run"]

  # ── Airflow profile ──────────────────────────────────────────────────

  airflow-postgres:
    image: postgres:16-alpine
    profiles:
      - airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-redis:
    image: redis:7-alpine
    profiles:
      - airflow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: ..
      dockerfile: docker/airflow.Dockerfile
    profiles:
      - airflow
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-redis:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg://airflow:airflow@airflow-postgres/airflow"
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CELERY__BROKER_URL: "redis://airflow-redis:6379/0"
      AIRFLOW__CELERY__RESULT_BACKEND: "db+postgresql+psycopg://airflow:airflow@airflow-postgres/airflow"
      AIRFLOW__WEBSERVER__SECRET_KEY: "dev-secret-change-in-prod"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      _AIRFLOW_WWW_USER_USERNAME: "${AIRFLOW_ADMIN_USER:-admin}"
      _AIRFLOW_WWW_USER_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:-admin}"
      PYTHONPATH: /opt/airflow
    volumes: &airflow-common-volumes
      - ../dags:/opt/airflow/dags:ro
      - ../data:/opt/airflow/data
      - ../models:/opt/airflow/models
      - ../configs:/opt/airflow/configs:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" || true

  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/airflow.Dockerfile
    profiles:
      - airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-triggerer:
    build:
      context: ..
      dockerfile: docker/airflow.Dockerfile
    profiles:
      - airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: triggerer
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "TriggererJob"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-worker:
    build:
      context: ..
      dockerfile: docker/airflow.Dockerfile
    profiles:
      - airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: celery worker
    healthcheck:
      test: ["CMD", "celery", "--app", "airflow.executors.celery_executor.app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-webserver:
    build:
      context: ..
      dockerfile: docker/airflow.Dockerfile
    profiles:
      - airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    profiles:
      - airflow
    ports:
      - "${MLFLOW_PORT:-5001}:5001"
    environment:
      MLFLOW_HOST: "0.0.0.0"
      MLFLOW_PORT: "5001"
    volumes:
      - ../mlruns:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5001
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

volumes:
  airflow-db:
