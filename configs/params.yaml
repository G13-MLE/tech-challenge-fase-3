# =============================================================================
# Parâmetros do pipeline
# =============================================================================

train:
  seed: 42
  test_size: 0.2
  random_forest_n_estimators: 100
  # Estratégia de peso das classes ('balanced' ou null para desativar)
  random_forest_class_weight: balanced
  tfidf_max_features: 500
  # Faixa de n-grams (min, max)
  tfidf_ngram_range: [1, 2]
  # Log1p na frequência de termos
  tfidf_sublinear_tf: true
  # Filtro de frequência de documentos
  tfidf_min_df: 2
  tfidf_max_df: 0.95
  # Stopwords em português (true usa a lista padrão; ou forneça uma lista)
  tfidf_stopwords: true
  # Número de folds para cross-validation (0 desativa)
  cv_folds: 5
