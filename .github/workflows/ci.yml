name: CI

on:
  push:
    branches: [main, "etapa-2/**", "etapa-4/**"]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".env.example"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".env.example"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Lint ──────────────────────────────────────────────────────────────────────

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # ── Test ────────────────────────────────────────────────────────────────────

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run pytest

  # ── Build & Push ────────────────────────────────────────────────────────────

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.repo.outputs.name }}/triage-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.repo.outputs.name }}/triage-api:buildcache
          cache-to: type=registry,ref=${{ steps.repo.outputs.name }}/triage-api:buildcache,mode=max
          provenance: false
